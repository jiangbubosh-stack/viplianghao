# Cloudflare Pages 项目配置
# 说明：本仓库同时通过 GitHub 连接到 Cloudflare Pages 部署，无需本地构建。
# 静态文件目录为 public/，API 为 functions/ 下的 Pages Functions。

name = "viplianghao"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# KV 命名空间绑定：存号码数据
# 方式一（推荐）：在 Cloudflare 仪表盘 Pages 项目 → Settings → Functions → KV namespace bindings
#   添加绑定，变量名（Variable name）必须填 NUMBERS_KV，并选择/新建一个 KV 命名空间。
# 方式二：把下面 id 替换成你在仪表盘创建的 KV 命名空间 ID（可选）。
[[kv_namespaces]]
binding = "NUMBERS_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
